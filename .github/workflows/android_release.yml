name: Build & Release Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Run the cheap checks (syntax gate + analyze + AuraSync tests) on every PR. The release
  # build steps below are gated to push events so PRs only run the checks.
  pull_request:

jobs:
  # SDK-free first gate: catches unbalanced delimiters in any Dart file
  # before the expensive JDK/Flutter build steps run. Fails the release if
  # the tree cannot even parse. This is not a substitute for `flutter analyze`
  # (see the Analyze Project step) — it is a cheap structural pre-check.
  syntax-gate:
    name: Dart syntax balance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Dart bracket balance (desifit + AuraSync)
        run: node tools/check_dart_syntax.js

      - name: Check signing-template drift
        run: node tools/check_signing_template.js

      - name: Check for private-key material
        run: node tools/check_no_private_keys.js

      # A malformed workflow file fails CI *silently* (zero jobs, no log) - as
      # happened 2026-09-03 with an unquoted colon in a step name. actionlint
      # parses the YAML and expression syntax up front, so a bad file fails
      # this gate loudly instead of killing every job at validation time.
      - name: Cache actionlint binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/actionlint
          key: actionlint-v1.7.12

      - name: Lint workflow files with actionlint
        shell: bash
        run: |
          set -euo pipefail
          ACL_DIR="$HOME/.cache/actionlint"
          ACL="$ACL_DIR/actionlint"
          if [ ! -x "$ACL" ]; then
            mkdir -p "$ACL_DIR"
            ok=0
            for i in 1 2 3; do
              if curl -fsSL --retry 3 -o "$ACL_DIR/actionlint.tar.gz" \
                "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"; then
                ok=1
                break
              fi
              echo "actionlint download attempt $i failed (transient network); retrying in 10s"
              sleep 10
            done
            [ "$ok" = "1" ] || { echo "actionlint download failed after 3 attempts"; exit 1; }
            tar -xzf "$ACL_DIR/actionlint.tar.gz" -C "$ACL_DIR"
            rm -f "$ACL_DIR/actionlint.tar.gz"
          fi
          find .github/workflows -maxdepth 1 \( -name "*.yml" -o -name "*.yaml" \) -exec "$ACL" {} +


  # Flutter analyze + full test suite for AuraSync. Until this job existed,
  # AuraSync was only syntax-gated (SDK-free bracket balance), which cannot
  # catch type errors or failing tests -- the same class of regression that
  # silently broke the desifit release build. Runs on pushes to main/tags and
  # on every pull request.
  aura-checks:
    name: Analyze & Test AuraSync
    needs: syntax-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: AuraSync
        run: flutter pub get

      - name: Analyze Project
        working-directory: AuraSync
        run: flutter analyze

      - name: Run Tests
        working-directory: AuraSync
        run: flutter test

  # Headless-Chromium e2e for the 30-screen HTML gallery: exercises the
  # animation engine API (anim-engine.spec.js) and per-screen nav + dark
  # mode (screen-nav.spec.js) against the real index.html and fixtures.
  gallery-e2e:
    name: Test gallery screens (Playwright)
    needs: syntax-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stitch_desifit_ui_design
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Key on the lockfile so browser downloads survive across runs;
          # a cache hit skips the apt/dl.google.com fetch that flaked on
          # 2026-09-03 (mirror mid-sync, exit 100) before any test ran.
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('stitch_desifit_ui_design/package-lock.json') }}

      - name: "Install Chromium (cold cache: deps + browser, with retry)"
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          ok=0
          for i in 1 2 3; do
            if npx playwright install --with-deps chromium; then ok=1; break; fi
            echo "browser install attempt $i failed (transient mirror/network); retrying in 10s"
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "browser install failed after 3 attempts"; exit 1; }

      - name: Verify Chromium (warm cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Run gallery tests
        run: npx playwright test

      # Evidence for red runs: Playwright writes test-results/ (with the
      # on-first-retry trace) next to the config; upload it whenever the
      # job fails so a triple-red never fails without artifacts to read.
      - name: Upload test results and traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: stitch_desifit_ui_design/test-results/
          if-no-files-found: ignore
          retention-days: 7


  build:
    name: Build Release AAB
    needs: syntax-gate
    runs-on: ubuntu-latest
    # On PRs this job runs only through `flutter analyze`; the release
    # signing/build/upload steps carry `if: github.event_name == 'push'`.
    # Push events also include version tags (v*), so the release still builds.

    steps:
      # Step 1: Check out the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java environment (matches Gradle requirements)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 2.5: Set up Gradle (advanced caching and build logging)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      # Step 3: Install Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Resolve dependencies
      - name: Install Dependencies
        working-directory: desifit
        run: flutter pub get

      # Step 5: Run Static Code Analysis (optional check)
      - name: Analyze Project
        working-directory: desifit
        run: flutter analyze

      # Step 5.25: Run the desifit widget/unit test suite. Ungated so it
      # runs on every PR and push, matching the AuraSync test gate.
      - name: Run Tests
        working-directory: desifit
        run: flutter test

      # Step 5.5: Configure Production Release Signing (if secrets are set)
      - name: Configure Production Signing
        if: github.event_name == 'push'
        working-directory: desifit
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_STORE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PLAY_STORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_STORE_KEY_ALIAS }}
        run: |
          # The keys written here must stay in sync with the template at
          # desifit/android/key.properties.example and with the signingConfigs
          # block in desifit/android/app/build.gradle.kts.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
            echo "Writing key.properties..."
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=key.jks"
            } > android/key.properties
          else
            echo "No signing secrets found. Building with debug signature fallback."
          fi

      # Step 6: Build Android App Bundle (AAB) with Obfuscation
      # Note: inject your OpenRouter key dynamically using secret variables if available
      - name: Build Release Bundle
        if: github.event_name == 'push'
        working-directory: desifit
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # --no-tree-shake-icons: the icon tree shaker's font subsetting
        # (pyftsubset) crashes with exit 255 on the GitHub Actions runner
        # (IconTreeShakerException), independent of app code.
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols --no-tree-shake-icons --dart-define=OPENROUTER_API_KEY="$OPENROUTER_KEY"

      # Step 7: Archive the compiled build artifact
      - name: Upload Android Release Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: desifit-release-bundle
          path: desifit/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
