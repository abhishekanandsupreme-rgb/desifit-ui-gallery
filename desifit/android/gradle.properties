# Gradle daemon heap sized for GitHub Actions runners (7 GB RAM): large
# enough for AGP/Kotlin/R8, small enough to avoid GC thrashing that kills
# the daemon mid-build.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true