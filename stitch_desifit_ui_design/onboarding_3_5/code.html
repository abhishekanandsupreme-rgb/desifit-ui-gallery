  <script>
(function() {
  var K = 'desifit-dark-mode';
  function apply() {
    try {
      var dark = localStorage.getItem(K) === 'true';
      document.documentElement.classList.toggle('dark', dark);
    } catch(e) {}
  }
  apply();
  window.addEventListener('storage', apply);
})();

<main class="flex-grow flex flex-col px-6 pt-12 pb-32 max-w-lg mx-auto w-full">
