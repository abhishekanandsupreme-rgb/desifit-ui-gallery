  <script>
(function() {
  var K = 'desifit-dark-mode';
  function apply() {
    try {
      var dark = localStorage.getItem(K) === 'true';
      document.documentElement.classList.toggle('dark', dark);
    } catch(e) {}
  }
  apply();
  window.addEventListener('storage', apply);
})();

<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-secondary-container rounded-xl flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div>
<p class="text-xs font-bold font-headline uppercase tracking-widest text-primary">Budget Hack</p>
<p class="text-on-surface font-semibold">25g Protein for ₹15</p>
</div>
</div>
</div>
</div>
</section>
<!-- Content Section: Editorial Voice -->
<section class="flex-grow px-8 pt-10 pb-24 relative">
<div class="space-y-4">
<div class="inline-flex items-center px-3 py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed-variant text-[10px] font-bold uppercase tracking-tighter">
                    Fueling India
                </div>
<h1 class="font-headline text-4xl font-extrabold text-on-surface leading-tight tracking-tight text-clay-glow">
                    Eat Like a King <br/>
<span class="text-primary italic">on a Peon's Budget</span>
</h1>
<p class="text-on-surface-variant text-lg leading-relaxed max-w-[90%]">
                    Track protein and cost for every meal. <br/> 
                    Stay <span class="font-bold text-on-surface">under ₹100/day</span> without losing gains.
                </p>
</div>
</section>

<footer class="fixed bottom-0 left-0 w-full px-8 pb-10 pt-4 bg-gradient-to-t from-surface via-surface/95 to-transparent">

<div class="h-1.5 w-8 rounded-full bg-primary shadow-sm"></div>
