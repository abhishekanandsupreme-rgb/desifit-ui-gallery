<body class="bg-surface font-body text-on-surface antialiased mb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#FAFAFA] dark:bg-stone-950 flex justify-between items-center px-4 py-2 w-full">
<div class="flex items-center gap-3">

<span class="text-xl font-bold text-[#E65100] dark:text-[#FF8A50] font-headline tracking-tight">DesiFit</span>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-stone-600">settings</span>
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden">

</div>
</div>
</header>
<main class="pt-16 px-4 max-w-2xl mx-auto">
<!-- Greeting Section -->
<section class="mt-6 mb-8">
<h1 class="text-3xl font-headline font-extrabold tracking-tight text-on-surface">Hello, Champ!</h1>
<p class="text-on-surface-variant font-medium mt-1">Ready to fuel up on a budget?</p>
</section>
<!-- Hero: Circular Gauges (Bento Style) -->
<section class="grid grid-cols-2 gap-4 mb-8">
<!-- Gauge 1: Budget -->
<div class="bg-surface-container-lowest p-5 rounded-3xl flex flex-col items-center justify-center shadow-[0_4px_20px_rgba(164,55,0,0.04)]">
<div class="relative w-24 h-24 mb-3">
<svg class="w-full h-full">
<circle class="text-surface-container-high" cx="48" cy="48" fill="transparent" r="40" stroke="currentColor" stroke-width="8"></circle>
<circle class="text-primary progress-ring__circle" cx="48" cy="48" fill="transparent" r="40" stroke="currentColor" stroke-dasharray="251.2" stroke-dashoffset="163" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="text-lg font-bold font-headline">₹35</span>
</div>
</div>
<p class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Budget Left</p>
<p class="text-[10px] text-stone-400 mt-0.5">Limit: ₹100</p>
</div>
<!-- Gauge 2: Protein -->
<div class="bg-surface-container-lowest p-5 rounded-3xl flex flex-col items-center justify-center shadow-[0_4px_20px_rgba(164,55,0,0.04)]">
<div class="relative w-24 h-24 mb-3">
<svg class="w-full h-full">
<circle class="text-surface-container-high" cx="48" cy="48" fill="transparent" r="40" stroke="currentColor" stroke-width="8"></circle>
<circle class="text-secondary progress-ring__circle" cx="48" cy="48" fill="transparent" r="40" stroke="currentColor" stroke-dasharray="251.2" stroke-dashoffset="84" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="text-lg font-bold font-headline text-secondary">40g</span>
</div>
</div>
<p class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Protein Hit</p>
<p class="text-[10px] text-stone-400 mt-0.5">Goal: 60g</p>
</div>
</section>
<!-- Quick Add Section -->
<section class="mb-8">
<div class="flex justify-between items-end mb-4">
<h2 class="text-xl font-headline font-bold text-on-surface">Quick Add</h2>
<span class="text-xs font-semibold text-primary uppercase tracking-widest">See All</span>
</div>
<div class="grid grid-cols-2 gap-3">
<!-- Sattu -->
<button class="flex flex-col items-start p-4 bg-surface-container-low rounded-2xl active:scale-95 transition-transform duration-200 text-left relative overflow-hidden group">
<div class="absolute top-0 right-0 p-2 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-4xl">local_drink</span>
</div>
<span class="text-sm font-bold text-on-surface mb-1">1 Glass Sattu</span>
<div class="flex flex-col gap-0.5">
<span class="text-xs text-primary font-bold">₹10</span>
<span class="text-xs text-secondary font-medium">10g protein</span>
</div>
</button>
<!-- Soya -->
<button class="flex flex-col items-start p-4 bg-surface-container-low rounded-2xl active:scale-95 transition-transform duration-200 text-left relative overflow-hidden group">
<div class="absolute top-0 right-0 p-2 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-4xl">nutrition</span>
</div>
<span class="text-sm font-bold text-on-surface mb-1">50g Soya</span>
<div class="flex flex-col gap-0.5">
<span class="text-xs text-primary font-bold">₹8</span>
<span class="text-xs text-secondary font-medium">25g protein</span>
</div>
</button>
<!-- Roti -->
<button class="flex flex-col items-start p-4 bg-surface-container-low rounded-2xl active:scale-95 transition-transform duration-200 text-left relative overflow-hidden group">
<div class="absolute top-0 right-0 p-2 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-4xl">bakery_dining</span>
</div>
<span class="text-sm font-bold text-on-surface mb-1">2 Roti</span>
<div class="flex flex-col gap-0.5">
<span class="text-xs text-primary font-bold">₹6</span>
<span class="text-xs text-secondary font-medium">6g protein</span>
</div>
</button>
<!-- Peanuts -->
<button class="flex flex-col items-start p-4 bg-surface-container-low rounded-2xl active:scale-95 transition-transform duration-200 text-left relative overflow-hidden group">
<div class="absolute top-0 right-0 p-2 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-4xl">grain</span>
</div>
<span class="text-sm font-bold text-on-surface mb-1">Handful Peanuts</span>
<div class="flex flex-col gap-0.5">
<span class="text-xs text-primary font-bold">₹5</span>
<span class="text-xs text-secondary font-medium">8g protein</span>
</div>
</button>
</div>
</section>
<!-- Banner Ad Section -->
<section class="mb-12">
<div class="relative w-full h-32 rounded-3xl overflow-hidden bg-surface-container-highest group">
<div class="absolute inset-0 bg-gradient-to-r from-stone-900/80 to-transparent z-10 flex flex-col justify-center px-6">
<h3 class="text-white font-bold text-lg mb-1 leading-tight">Amazon Deal</h3>
<p class="text-white/80 text-xs mb-3">Buy 1kg Peanut Butter on Amazon</p>
<button class="bg-white text-stone-900 px-4 py-1.5 rounded-full text-[10px] font-bold w-max uppercase tracking-wider">Shop Now</button>
</div>
<img class="w-full h-full object-cover" data-alt="High quality jar of creamy peanut butter on a rustic wooden table with peanuts scattered around, warm earthy tones" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDmv1BbT9lEWsS0UL5oxAQcZZFQ_ED4NbriHr__nSI5ojDAMXD8ETsqrErHMviiLDCtCBs_j2udObuMvUlc2fPebxgpGgxBYtVPWGAx8OnDLFy7g39J55-AltmiAObChneyEKK3EV4mmrSN3TGEWQy4Iua45QDDQcD0wi8AuMI7Dkca_KVVdo9axO2q8dbM6g-6cFrUn38byP8h-5_vWLivDY_iI8d-c5mm9LEA_DmsrId3cUlUAfwjbcljJ4t1-2_2a7ikcwT2494"/>
</div>
</section>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>

<span class="text-[11px] font-medium font-headline">Recipes</span>
</a>
<!-- Coach -->

<span class="material-symbols-outlined">smart_toy</span>
<span class="text-[11px] font-medium font-headline">Coach</span>
</a>
